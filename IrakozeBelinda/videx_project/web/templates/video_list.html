{% extends 'base.html' %}
{% block title %}{% endblock %}
{% load static %}

{% block extra_css %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'styles/video_list.css' %}">
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col">
            <img src="{% static 'images/videx_logo.png' %}" alt="Videx Logo" style="height: 50px;">
        </div>
        <div class="col">
            <a href="{% url 'add_video' %}"><button>Add Video</button></a>
        </div>
    </div>
    <h1 class="mb-4">Videos</h1>
    <hr>
    <div class="row">
        {% for video in videos %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <img src="{{ video.thumbnail.url }}" class="card-img-top" alt="{{ video.title }}">
                
            </div>

            <div class="card-body">
                    <h5 class="card-title">{{ video.title }}</h5>
                    <p class="card-text">{{ video.description }}</p>
                </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
